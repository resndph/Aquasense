services:
  mysqlcontainer:
    image: mysql:8.0
    container_name: mysqlcontainer
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: db_monitoramento
    ports:
      - "3307:3306"
    volumes:
      - ./docker/mysql_data:/var/lib/mysql
    command: >
      --default-authentication-plugin=mysql_native_password
    healthcheck:
      # Modificado para usar 127.0.0.1, garantindo que o ping responda sem falhas de rede interna
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
      
  jaeger:
    image: jaegertracing/all-in-one:1.57
    container_name: jaegercontainer
    restart: always
    ports:
      - "16686:16686" # Interface Web
      - "4318:4318"   # Recebimento de traces OTLP via HTTP

  apicontainer:
    build: .
    container_name: apicontainer
    depends_on:
      mysqlcontainer:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "3000:3000"
    working_dir: /app
    # Executa a migração e injeta o OpenTelemetry na inicialização do servidor
    command: >
      sh -c "
        npx sequelize-cli db:migrate &&
        NODE_OPTIONS='--require ./instrumentation.js' yarn start
      "

  sensor-simulator:
    build: ./sensor-simulator
    container_name: sensor-simulator
    depends_on:
      - apicontainer
    env_file:
      - ./sensor-simulator/.env
    restart: always

volumes:
  mysql_data: