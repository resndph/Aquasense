version: "3.9"

services:
  mysqlcontainer:
    image: mysql:8.0
    container_name: mysqlcontainer
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: db_monitoramento
    ports:
      - "3306:3306"
    volumes:
      - ./docker/mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci

  apicontainer:
    build: .
    container_name: apicontainer
    depends_on:
      mysqlcontainer:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "3000:3000"
    volumes:
      - .:/app
    working_dir: /app
    command: >
      sh -c "
        echo '>> Esperando MySQL ficar OK...' &&
        until nc -z mysqlcontainer 3306; do
          echo 'Aguardando conexão com MySQL...';
          sleep 2;
        done &&
        echo 'MySQL pronto! Executando migrations...' &&
        npx sequelize-cli db:migrate &&
        echo 'Iniciando servidor...' &&
        yarn dev
      "
      
volumes:
  mysql_data:
