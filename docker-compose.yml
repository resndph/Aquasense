version: "3.9"

services:
  mysqlcontainer:
    image: mysql:8.0
    container_name: mysqlcontainer
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: db_monitoramento
    ports:
      - "3307:3306"
    volumes:
      - ./docker/mysql_data:/var/lib/mysql
    command: >
      --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  apicontainer:
    build: .
    container_name: apicontainer
    depends_on:
      mysqlcontainer:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "3000:3000"
    volumes:
      - .:/app
    working_dir: /app
    command: >
      sh -c "
        npx sequelize-cli db:migrate &&
        yarn dev
      "
volumes:
  mysql_data: